# =============================================================================
# trino-benchmark-job.yaml
#
# Design goals:
#   - This pod is a thin Python client; it submits queries to the Trino
#     cluster via REST and records server-reported stats (elapsedTimeMillis,
#     peakMemoryBytes, cpuTimeMillis) from the final payload.
#   - Trino cluster resource budget = coordinator + workers should total
#     ~6 vCPU + ~26 Gi to match the Spark cluster.
#     Current: 1 coordinator (2 vCPU / 6 Gi) + 2 workers (2 vCPU / 10 Gi each).
#     This is configured in the Trino Helm values — see trino-values.yaml.
#   - The runner pod itself is deliberately tiny (0.25 vCPU / 256 Mi); it
#     spends 99% of its time waiting for HTTP responses.
#   - Shares the same PVC as the Spark job so build_report.py sees both files.
#
# IMPORTANT: run the Spark job first (or in parallel), never both jobs on
# the same node — they must not compete for CPU/memory with each other.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: trino-benchmark-runner
  namespace: data-platform
  labels:
    app: benchmark
    engine: trino
    dataset: tpcds-sf5
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: benchmark
        engine: trino
    spec:
      restartPolicy: Never

      # ── Node placement ─────────────────────────────────────────────────────
      # Pin the runner pod to infra-pool so it does NOT share a node with
      # Trino workers (which sit on query-pool). This isolates the client
      # overhead from the engine under test.
      # nodeSelector:
      #   role: infra

      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: benchmark-results-pvc
        - name: queries
          configMap:
            name: tpcds-queries

      initContainers:
        - name: wait-trino
          image: trinodb/trino:479
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for Trino coordinator and 2 workers..."
              until trino --server http://trino:8080 --user benchmark --execute "SELECT 1 FROM system.runtime.nodes WHERE coordinator = false AND state = 'active' HAVING count(*) = 2" --output-format CSV | grep -q "1"; do
                echo "Waiting for 2 active workers..."
                sleep 5
              done
              echo "Trino cluster ready with 2 workers."

      containers:
        - name: trino-benchmark
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          env:
            - name: TRINO_BASE_URL
              value: "http://trino:8080"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          volumeMounts:
            - name: results
              mountPath: /benchmark/results
            - name: queries
              mountPath: /benchmark/queries

          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              echo "=== CHỜ CODE TỪ MÁY CỤC BỘ (kubectl cp) ==="
              mkdir -p /tmp/app

              until [ -f /tmp/app/benchmark/scripts/run_trino_benchmark.py ]; do
                echo "Đang chờ code tại /tmp/app/benchmark/scripts/run_trino_benchmark.py..."
                echo "Vui lòng chạy lệnh sau trên máy của bạn:"
                echo "  kubectl cp benchmark data-platform/$(hostname):/tmp/app/"
                sleep 5
              done

              echo "=== CODE ĐÃ SẴN SÀNG ==="
              pip install --quiet requests kubernetes

              echo "=== Loading config ==="
              sed -i 's/\r$//' /tmp/app/benchmark/config/benchmark.env
              set -a
              source /tmp/app/benchmark/config/benchmark.env
              set +a

              # Env vars được inject bởi K8s sẽ ghi đè giá trị trong file .env
              export RESULTS_DIR=/benchmark/results

              echo "=== Starting Trino benchmark ==="
              cd /tmp/app
              python3 -u benchmark/scripts/run_trino_benchmark.py

              echo "=== BENCHMARK FINISHED ==="
              echo "Pod is kept alive for 30 minutes for data retrieval."
              echo "Run this command to sync results to your local machine:"
              echo "  kubectl cp data-platform/$(hostname):/benchmark/results/raw/trino_results.jsonl benchmark/results/raw/trino_results.jsonl"
              sleep 1800