# =============================================================================
# spark-benchmark-job.yaml  (Spark-on-Kubernetes distributed mode)
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: spark-benchmark-runner
  namespace: data-platform
  labels:
    app: benchmark
    engine: spark
    dataset: tpcds-sf5
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: benchmark
        engine: spark
        spark-role: driver
    spec:
      serviceAccountName: spark-driver
      restartPolicy: Never

      nodeSelector:
        role: compute
      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: spark-results-pvc
        - name: executor-pod-template
          configMap:
            name: spark-executor-pod-template

      initContainers:
        - name: wait-metastore
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z hive-metastore 9083; do
                echo "Waiting for hive-metastore:9083 …"
                sleep 3
              done

      containers:
        - name: spark-benchmark
          image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
          securityContext:
            runAsUser: 0
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: "2000m"
              memory: "8Gi"
            limits:
              cpu: "4000m"
              memory: "10Gi"

          ports:
            - containerPort: 7078
              name: driver-rpc
            - containerPort: 7079
              name: block-manager
            - containerPort: 4040
              name: spark-ui

          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: spark-minio-secret
                  key: MINIO_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: spark-minio-secret
                  key: MINIO_SECRET_KEY
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SPARK_MASTER
              value: "k8s://https://kubernetes.default.svc:443"
            - name: K8S_NAMESPACE
              value: "data-platform"
            - name: SPARK_IMAGE
              value: "apache/spark:3.5.3-scala2.12-java17-python3-ubuntu"
            - name: SPARK_EXECUTOR_INSTANCES
              value: "2"
            - name: SPARK_EXECUTOR_CORES
              value: "4"
            - name: SPARK_EXECUTOR_MEMORY
              value: "9g"
            - name: SPARK_DRIVER_CORES
              value: "4"
            - name: SPARK_DRIVER_MEMORY
              value: "7g"
            - name: SPARK_EXECUTOR_POD_TEMPLATE
              value: "/opt/spark/conf/executor-pod-template.yaml"

          volumeMounts:
            - name: results
              mountPath: /benchmark/results
            - name: executor-pod-template
              mountPath: /opt/spark/conf/executor-pod-template.yaml
              subPath: executor-pod-template.yaml

          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              echo "=== Installing dependencies ==="
              apt-get update -qq && apt-get install -y -qq git
              pip install --quiet pyspark==3.5.3 boto3

              echo "=== Cloning benchmark harness ==="
              git clone --depth 1 --branch dev \
                https://github.com/dducsw/bdcon-data-platform /app

              echo "=== Loading config ==="
              set -a
              source /app/benchmark/config/benchmark.env
              set +a

              export RESULTS_DIR=/benchmark/results

              echo "=== Driver host: ${MY_POD_IP} ==="
              echo "=== Starting Spark benchmark (K8s mode, ${SPARK_EXECUTOR_INSTANCES} executors) ==="
              cd /app
              python3 -u benchmark/scripts/run_spark_benchmark.py

              echo "=== BENCHMARK FINISHED ==="
              echo "Pod is kept alive for 30 minutes for data retrieval."
              echo "Run this command to sync results to your local machine:"
              echo "  kubectl cp data-platform/$(hostname):/benchmark/results/raw/spark_results.jsonl benchmark/results/raw/spark_results.jsonl"
              sleep 1800