# =============================================================================
# spark-benchmark-job.yaml  (Spark-on-Kubernetes distributed mode)
#
# Thay đổi so với phiên bản local[4]:
#   - Driver vẫn chạy IN-PROCESS trong pod này (deploy-mode: client)
#   - Master chuyển sang k8s://https://kubernetes.default.svc:443
#   - Executor pods được spawn động trên compute-pool + query-pool
#   - Pod template ConfigMap mount vào /opt/spark/conf/
#   - Driver expose port 7078 (RPC) + 7079 (block manager) để executor
#     kết nối ngược về; port 4040 cho Spark UI
#   - POD_IP inject từ Downward API để spark.driver.host đúng
#
# Resource budget (tương đương Trino):
#   Driver pod:   2 vCPU / 8 Gi
#   2 Executors:  4 vCPU / 9g mỗi cái  →  tổng ~10 vCPU / 26 Gi
#   (điều chỉnh SPARK_EXECUTOR_INSTANCES trong benchmark.env nếu muốn)
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: spark-benchmark-runner
  namespace: data-platform
  labels:
    app: benchmark
    engine: spark
    dataset: tpcds-sf5
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: benchmark
        engine: spark
        spark-role: driver          # dùng cho podAntiAffinity của executor
    spec:
      serviceAccountName: spark-driver
      restartPolicy: Never

      # ── Driver chạy trên infra-pool (để nhường node compute cho executor) ──
      nodeSelector:
        cloud.google.com/gke-nodepool: infra-pool

      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: benchmark-results-pvc
        - name: queries
          configMap:
            name: tpcds-queries
        # Mount executor pod template vào /opt/spark/conf/
        - name: executor-pod-template
          configMap:
            name: spark-executor-pod-template

      initContainers:
        # Chờ Hive Metastore sẵn sàng trước khi start SparkSession
        - name: wait-metastore
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z hive-metastore 9083; do
                echo "Waiting for hive-metastore:9083 …"
                sleep 3
              done

      containers:
        - name: spark-benchmark
          image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
          securityContext:
            runAsUser: 0
          imagePullPolicy: IfNotPresent

          # ── Resource budget cho Driver pod ─────────────────────────────────
          # Driver chỉ cần vừa đủ; phần nặng do executor xử lý.
          resources:
            requests:
              cpu: "2000m"
              memory: "8Gi"
            limits:
              cpu: "4000m"
              memory: "10Gi"

          # ── Driver phải expose các port này để executor kết nối ngược ──────
          ports:
            - containerPort: 7078   # spark.driver.port (RPC)
              name: driver-rpc
            - containerPort: 7079   # spark.blockManager.port
              name: block-manager
            - containerPort: 4040   # Spark Web UI
              name: spark-ui

          env:
            # ── MinIO credentials (mirror sang executor qua secretKeyRef) ───
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: spark-minio-secret
                  key: MINIO_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: spark-minio-secret
                  key: MINIO_SECRET_KEY

            # ── Downward API: pod IP dùng cho spark.driver.host ─────────────
            # Thiếu cái này executor không biết địa chỉ nào để kết nối driver.
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            # ── Spark-on-K8s overrides (ghi đè benchmark.env nếu cần) ───────
            - name: SPARK_MASTER
              value: "k8s://https://kubernetes.default.svc:443"
            - name: K8S_NAMESPACE
              value: "data-platform"
            - name: SPARK_IMAGE
              value: "apache/spark:3.5.3-scala2.12-java17-python3-ubuntu"
            - name: SPARK_EXECUTOR_INSTANCES
              value: "2"
            - name: SPARK_EXECUTOR_CORES
              value: "2"
            - name: SPARK_EXECUTOR_MEMORY
              value: "4g"
            - name: SPARK_DRIVER_CORES
              value: "2"
            - name: SPARK_DRIVER_MEMORY
              value: "4g"
            # Path tới executor pod template bên trong container
            - name: SPARK_EXECUTOR_POD_TEMPLATE
              value: "/opt/spark/conf/executor-pod-template.yaml"

          volumeMounts:

            - name: results
              mountPath: /benchmark/results
            - name: queries
              mountPath: /benchmark/queries
            - name: executor-pod-template
              mountPath: /opt/spark/conf/executor-pod-template.yaml
              subPath: executor-pod-template.yaml

          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              echo "=== CHỜ CODE TỪ MÁY CỤC BỘ (kubectl cp) ==="
              mkdir -p /tmp/app

              until [ -f /tmp/app/benchmark/scripts/run_spark_benchmark.py ]; do
                echo "Đang chờ code tại /tmp/app/benchmark/scripts/run_spark_benchmark.py..."
                echo "Vui lòng chạy lệnh sau trên máy của bạn:"
                echo "  kubectl cp benchmark data-platform/$(hostname):/tmp/app/"
                sleep 5
              done

              echo "=== CODE ĐÃ SẴN SÀNG ==="
              pip install --quiet boto3

              echo "=== Loading config ==="
              sed -i 's/\r$//' /tmp/app/benchmark/config/benchmark.env
              set -a
              source /tmp/app/benchmark/config/benchmark.env
              set +a

              # Env vars được inject bởi K8s sẽ ghi đè giá trị trong file .env
              export RESULTS_DIR=/benchmark/results

              echo "=== Driver host: ${MY_POD_IP} ==="
              echo "=== Starting Spark benchmark (Spark-on-K8s, ${SPARK_EXECUTOR_INSTANCES} executors) ==="
              cd /tmp/app
              python3 -u benchmark/scripts/run_spark_benchmark.py

              echo "=== BENCHMARK FINISHED ==="
              echo "Pod is kept alive for 30 minutes for data retrieval."
              echo "Run this command to sync results to your local machine:"
              echo "  kubectl cp data-platform/$(hostname):/benchmark/results/raw/spark_results.jsonl benchmark/results/raw/spark_results.jsonl"
              sleep 1800