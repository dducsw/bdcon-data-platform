# =============================================================================
# spark-rbac.yaml
#
# ServiceAccount + Role + RoleBinding cho spark-driver.
# Driver pod cần quyền tạo/xoá executor pods, services, và configmaps
# trong namespace data-platform khi chạy ở chế độ Spark-on-Kubernetes.
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-driver
  namespace: data-platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver-role
  namespace: data-platform
rules:
  # Tạo / xoá executor pods, đọc trạng thái
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
  # Đọc log executor
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  # Driver tự tạo headless Service để executor kết nối ngược về
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Spark dùng ConfigMap để truyền cấu hình cho executor
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "delete", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver-rolebinding
  namespace: data-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-driver-role
subjects:
  - kind: ServiceAccount
    name: spark-driver
    namespace: data-platform