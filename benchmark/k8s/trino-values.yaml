# ====================================================================
# Trino Official Helm Chart Values
# Helm Chart: https://trinodb.github.io/charts/
# ====================================================================

image:
  repository: trinodb/trino
  tag: "479" # Aligned with Chart app version 479

server:
  workers: 2   # Default for production-like dev
  node:
    environment: production
  log:
    trino:
      level: INFO
  etcFiles:
    click_events.json: |
      {
        "tableName": "click_events",
        "schemaName": "default",
        "topicName": "click_events",
        "message": {
          "dataFormat": "json",
          "fields": [
            {
              "name": "id",
              "mapping": "id",
              "type": "BIGINT"
            },
            {
              "name": "user_id",
              "mapping": "user_id",
              "type": "BIGINT"
            },
            {
              "name": "sequence_number",
              "mapping": "sequence_number",
              "type": "INTEGER"
            },
            {
              "name": "session_id",
              "mapping": "session_id",
              "type": "VARCHAR"
            },
            {
              "name": "ip_address",
              "mapping": "ip_address",
              "type": "VARCHAR"
            },
            {
              "name": "city",
              "mapping": "city",
              "type": "VARCHAR"
            },
            {
              "name": "state",
              "mapping": "state",
              "type": "VARCHAR"
            },
            {
              "name": "postal_code",
              "mapping": "postal_code",
              "type": "VARCHAR"
            },
            {
              "name": "browser",
              "mapping": "browser",
              "type": "VARCHAR"
            },
            {
              "name": "traffic_source",
              "mapping": "traffic_source",
              "type": "VARCHAR"
            },
            {
              "name": "uri",
              "mapping": "uri",
              "type": "VARCHAR"
            },
            {
              "name": "event_type",
              "mapping": "event_type",
              "type": "VARCHAR"
            },
            {
              "name": "created_at",
              "mapping": "created_at",
              "type": "VARCHAR"
            }
          ]
        }
      }

# Inject secrets via Environment Variables from K8s Secret
env:
  - name: MINIO_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: spark-minio-secret
        key: MINIO_ACCESS_KEY
  - name: MINIO_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: spark-minio-secret
        key: MINIO_SECRET_KEY

coordinator:
  jvm:
    maxHeapSize: "4G"
    gcMethod:
      type: "UseG1GC"
      g1:
        heapRegionSize: "32M"
  resources:
    requests:
      memory: "6Gi"
      cpu: "2"
    limits:
      memory: "6Gi"
      cpu: "2"
  nodeSelector:
    role: infra         # COORDINATOR MUST BE ON INFRA (ON-DEMAND) NODE
  # No tolerations needed for infra node
  terminationGracePeriodSeconds: 15

worker:
  jvm:
    maxHeapSize: "8G"  # Higher heap for workers on Spot nodes
    gcMethod:
      type: "UseG1GC"
      g1:
        heapRegionSize: "32M"
  resources:
    requests:
      memory: "10Gi"
      cpu: "2"
    limits:
      memory: "10Gi"
      cpu: "2"
  nodeSelector: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: role
            operator: In
            values:
            - query
            - compute
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/component
            operator: In
            values:
            - worker
        topologyKey: "kubernetes.io/hostname"
  tolerations:
    - key: "cloud.google.com/gke-spot"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  terminationGracePeriodSeconds: 15

service:
  type: ClusterIP
  port: 8080

additionalConfigProperties:
  - "query.max-memory-per-node=5.5GB"
  - "query.max-total-memory-per-node=7GB"
  - "memory.heap-headroom-per-node=1GB"
  - "query.max-history=100"
  - "spill-enabled=true"
  - "spiller-spill-path=/data/trino/spill"
  - "max-spill-per-node=20GB"
  - "query.max-spill-per-node=10GB"
  - "join-distribution-type=AUTOMATIC"
  - "optimizer.join-reordering-strategy=AUTOMATIC"

# Define catalogs dynamically
# NOTE: Trino 471 supports Env var interpolation if enabled. 
# For now, using standard properties with a note for learning.
additionalCatalogs:
  catalog_iceberg: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://gravitino:9001/iceberg/
    fs.native-s3.enabled=true
    s3.endpoint=http://minio:9000
    s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
    s3.aws-secret-key=${ENV:MINIO_SECRET_KEY}
    s3.path-style-access=true
    s3.region=us-east-1
  iceberg_hive: |
    connector.name=iceberg
    iceberg.catalog.type=hive_metastore
    hive.metastore.uri=thrift://hive-metastore:9083
    fs.native-s3.enabled=true
    s3.endpoint=http://minio:9000
    s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
    s3.aws-secret-key=${ENV:MINIO_SECRET_KEY}
    s3.path-style-access=true
    s3.region=us-east-1
  hive: |
    connector.name=hive
    hive.metastore.uri=thrift://hive-metastore:9083
    fs.native-s3.enabled=true
    s3.endpoint=http://minio:9000
    s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
    s3.aws-secret-key=${ENV:MINIO_SECRET_KEY}
    s3.path-style-access=true
    s3.region=us-east-1
  kafka: |
    connector.name=kafka
    kafka.nodes=data-platform-kafka-bootstrap:9092
    kafka.table-description-dir=/etc/trino
    kafka.hide-internal-columns=false
  postgres_source: |
    connector.name=postgresql
    connection-url=jdbc:postgresql://postgres-source:5432/thelook_db
    connection-user=db_user
    connection-password=db_password
